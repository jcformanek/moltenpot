# @package _global_
# Setting-3 re-run: C4 with winning IQL hparams (from tune_coins_5).
# 20k updates, NO eval during training (eval_at_end), post-training eval on the
# split's default set (out_dist_eval from benchmark_coins_C4).
defaults:
  - benchmark_coins_C4
  - override /algorithm: iql
  - _self_

data_root: /workspace/hp_data/coins
num_updates: 20000
eval_at_end: true

algorithm:
  q_lr: 5e-05
  v_lr: 5e-05
  actor_lr: 5e-05
  beta: 3

wandb:
  group: rerun_C4
