# =============================================================================
# algorithm/bcq.yaml — Batch-Constrained Q-Learning (BCQ-D) hyperparameters
# =============================================================================
# Usage: python scripts/train_offline.py algorithm=bcq ...
# Key hyperparameter: tau (action constraint threshold, lower = more conservative)

name: bcq

# Q-network optimizer
q_lr:        3e-4

# Imitator (behaviour policy) optimizer
imitator_lr: 3e-4

# RL discount
gamma:    0.99

# Soft target update rate
tau_soft: 0.005

# Action constraint threshold: mask actions where π(a|s)/max_π(a|s) < tau
# Smaller tau → more permissive (closer to standard Q-learning)
# Larger tau  → more conservative (closer to pure BC)
tau: 0.3
