# =============================================================================
# Setting 1 — single-scenario offline RL (allelopathic_harvest)
# =============================================================================
# Train each algorithm on each scenario independently.
# 13 scenarios x 4 algorithms x 3 seeds = 156 runs.
# =============================================================================

name: moltenpot-setting1-allelopathic_harvest
program: scripts/train_offline.py
method: grid

metric:
  name: in_dist/return_mean
  goal: maximize

parameters:
  algorithm:
    values: [bc, bcq, iql, cql]
  train_mode:
    values:
      - allelopathic_harvest__open_0
      - allelopathic_harvest__open_1
      - allelopathic_harvest__open_2
      - allelopathic_harvest__open_3
      - allelopathic_harvest__open_4
      - allelopathic_harvest__open_5
      - allelopathic_harvest__open_6
      - allelopathic_harvest__open_7
      - allelopathic_harvest__open_8
      - allelopathic_harvest__open_9
      - allelopathic_harvest__open_10
      - allelopathic_harvest__open_11
      - allelopathic_harvest__open_12
  seed:
    values: [1, 2, 3]

command:
  - ${env}
  - python
  - ${program}
  - +experiment=sweep_setting1
  - substrate=allelopathic_harvest
  - data_root=data/allelopathic_harvest
  - model.num_actions=11
  - model.max_agents=16
  - ${args_no_hyphens}
