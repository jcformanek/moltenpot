# =============================================================================
# Setting 3 — zero-shot social generalisation (clean_up)
# =============================================================================
# For each split, train on the train-side scenarios and evaluate zero-shot on
# the test-side ones. 3 splits x 4 algorithms x 3 seeds = 36 runs.
# =============================================================================

name: moltenpot-setting3-clean_up
program: scripts/train_offline.py
method: grid

metric:
  name: out_dist/return_mean
  goal: maximize

parameters:
  algorithm:
    values: [bc, bcq, iql, cql]
  experiment:
    values:
      - benchmark_clean_U1
      - benchmark_clean_U2
      - benchmark_clean_U3
  seed:
    values: [1, 2, 3]

command:
  - ${env}
  - python
  - ${program}
  - +experiment=${experiment}
  - algorithm=${algorithm}
  - seed=${seed}
