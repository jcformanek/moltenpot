# =============================================================================
# CQL hyper-parameter tuning — Setting-3 leak re-tune (coins C4 + allelo A1)
# =============================================================================
# Both tuning scenarios via +experiment. CQL sweeps LR (q_lr) and the CQL
# conservative weight (cql_alpha).
#
# Grid: 2 scenarios x 3 LR x 3 cql_alpha = 18 runs.
# Winner per scenario = highest eval/in_dist/return_mean (final 100-ep eval).
# =============================================================================

name: moltenpot-tune-cql
program: scripts/train_offline.py
method: grid

metric:
  name: eval/in_dist/return_mean
  goal: maximize

parameters:
  "+experiment":
    values: [tune_coins_5, tune_allelopathic_open_1]
  algorithm.q_lr:
    values: ["3e-4", "1e-4", "5e-5"]
  algorithm.cql_alpha:
    values: [2, 5, 10]

command:
  - ${env}
  - python
  - ${program}
  - algorithm=cql
  - ${args_no_hyphens}
